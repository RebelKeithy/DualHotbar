// Shared build logic for every node of every mod: one node per <minecraft>-<loader> target, e.g. the
// project :examplemod:26.3-fabric in mods/examplemod/versions/26.3-fabric. Applied by each mod's build.gradle.
// Versions come from minecraft/<minecraft>.properties; mod_id, mod_name, etc. from the mod's gradle.properties.
plugins {
    id 'java-library'
    id 'idea'
}

// The mod's own settings (mod_id, mod_name, ...) from mods/<id>/gradle.properties. Loaded explicitly because
// Gradle 10 stops projects from reading properties out of their parent project's gradle.properties.
def modProperties = new Properties()
project.parent.file('gradle.properties').withInputStream { modProperties.load(it) }
modProperties.each { key, value -> ext.set(key as String, value) }

def (targetMinecraft, targetLoader) = project.name.split('-', 2) as List
ext.target_minecraft = targetMinecraft
ext.target_loader = targetLoader
def pins = new Properties()
rootProject.file("minecraft/${targetMinecraft}.properties").withInputStream { pins.load(it) }
pins.each { key, value -> ext.set(key as String, value) }

// Lets shared code use loader conditions: //? if fabric { ... } / //? if neoforge { ... }
stonecutter.constants.match(targetLoader, 'fabric', 'neoforge')

// Stonecutter links the shared src/ into the active version and generates processed copies for the others.
ext.stonecutter_main_dir = stonecutter.current.isActive
        ? file('../../src/main')
        : layout.buildDirectory.dir('generated/stonecutter/main').get().asFile

// Optional shared files, declared once in src/main/resources and wired into each loader:
// <mod_id>.mixins.json (mixin config) and <mod_id>.classtweaker (Fabric's access widener format, converted to an
// access transformer for NeoForge). Read from the shared src/, so their entries apply to every version.
ext.mixin_config = file("../../src/main/resources/${mod_id}.mixins.json")
ext.class_tweaker = file("../../src/main/resources/${mod_id}.classtweaker")

version = "${mod_version}+${project.name}"
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.1 and later, so mods target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Each loader compiles the shared code plus its own package; the other loader's package is left out.
def otherLoader = targetLoader == 'fabric' ? 'neoforge' : 'fabric'
sourceSets.main.java.exclude("${mod_group_id.replace('.', '/')}/${otherLoader}/**")

sourceSets.main.resources {
    // Include resources generated by data generators for this node.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("**/.cache") // datagen cache files
}

// Expands ${} properties and <% %> blocks in src/main/templates/<loader> (fabric.mod.json or
// META-INF/neoforge.mods.toml). A missing property will result in an error.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = pins.collectEntries { key, value -> [(key): value] } + [
            mod_id            : mod_id,
            mod_name          : mod_name,
            mod_license       : mod_license,
            mod_version       : project.version.toString(),
            has_mixins        : project.mixin_config.isFile(),
            has_access_widener: project.class_tweaker.isFile(),
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from new File(project.stonecutter_main_dir, "templates/${targetLoader}")
    if (!stonecutter.current.isActive) dependsOn 'stonecutterGenerate'
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build. The explicit
// dependency is needed because Fabric Loom rebuilds the resource directory list without task links.
sourceSets.main.resources.srcDir generateModMetadata
tasks.named('processResources') { dependsOn generateModMetadata }

// Run configuration names, e.g. "examplemod 26.3-fabric - Client".
ext.run_display_name = { String run -> "${mod_id} ${project.name} - ${[datagen: 'Data'][run] ?: run.capitalize()}".toString() }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
    module {
        downloadSources = true
        // Javadoc jars are skipped to save disk space; the sources jars already contain the docs.
        downloadJavadoc = false
    }
}

pluginManager.apply("${targetLoader}-node")
