# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Java 25 lives in ~/.jdks instead of the system Java folders so it doesn't become the Mac's default `java`.
# If this path doesn't exist, the foojay plugin downloads a Java 25 toolchain instead.
org.gradle.java.installations.paths=/Users/mit/.jdks/amazon-corretto-25.jdk/Contents/Home

# Minecraft, NeoForge and Fabric versions live in minecraft/<minecraft>.properties.
# Mod properties (mod_id, targets, ...) live in each mod's own gradle.properties.

# The build scripts are Groovy; this acknowledges Stonecutter's Groovy warning.
dev.kikugie.stonecutter.hard_mode=true
