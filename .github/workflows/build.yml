# Builds every Dual Hotbar jar (each Minecraft version and loader) on every push and pull request. Pushing a tag
# v<mod_version> also publishes a GitHub release with the jars attached.
name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches mod_version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^mod_version=//p' mods/dualhotbar/gradle.properties)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match mod_version=$version in mods/dualhotbar/gradle.properties"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build every target
        run: ./gradlew build --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: dualhotbar-jars
          path: mods/dualhotbar/versions/*/build/libs/*.jar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dualhotbar-jars
          path: jars

      - uses: softprops/action-gh-release@v2
        with:
          name: Dual Hotbar ${{ github.ref_name }}
          files: jars/**/*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true
