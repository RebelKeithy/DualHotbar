# NeoForge metadata for this mod, filled in from gradle.properties by the build (generateModMetadata).
# Format reference: https://docs.neoforged.net/docs/gettingstarted/modfiles/
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
A second hotbar from the bottom row of your inventory, shown above the hotbar. Shift + scroll swaps them.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
