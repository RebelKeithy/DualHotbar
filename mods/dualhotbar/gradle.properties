# Mod Properties. Minecraft, NeoForge and Fabric versions are shared in minecraft/<minecraft>.properties.

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match MOD_ID in the mod's common class.
mod_id=dualhotbar
# The human-readable display name for the mod.
mod_name=Dual Hotbar
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=All Rights Reserved
# The mod version. See https://semver.org/
mod_version=1.1.0
# The group ID for the mod. This is also the base package of the mod's sources.
mod_group_id=io.github.rebelkeithy.dualhotbar
# Minecraft version + loader combinations this mod is built for, as <minecraft>-<loader>.
# The last one is the version whose code is committed to git.
targets=26.1-fabric, 26.1-neoforge, 26.2-fabric, 26.2-neoforge, 26.3-fabric, 26.3-neoforge
